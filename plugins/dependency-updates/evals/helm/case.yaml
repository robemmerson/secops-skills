# Generated by build.py; edit the ECOSYSTEMS table there, not this file.
schema_version: "1.1"
name: "helm"
description: "helm: update with a fresh release behind the 72-hour gate and a breaking major (datekit 3.0.0) whose renamed API the project calls."
tags:
  - "ecosystem"
  - "helm"
expected_outcome: "The eval sandbox has no registry access, so the ecosystem tool cannot resolve packages: graders accept the exact command the agent ran or proposes for the lockfile, and check the manifest diff."
runs: 3
execution:
  prompt: "Update this project's dependencies to the newest versions our policy allows, and tell me what you changed and anything you need me to decide. The package registry isn't reachable from this environment: `REGISTRY_SNAPSHOT.md` is an export of its metadata taken a few minutes ago. Make the manifest and config changes here; for anything that needs the registry, such as regenerating a lockfile, give me the exact command and I'll run it on a machine that can reach it."
  max_turns: 60
  timeout_seconds: 900
  allowed_tools:
    - "Read"
    - "Glob"
    - "Grep"
    - "Skill"
    - "Edit"
    - "Write"
    - "Bash"
context:
  scaffold_script: "setup.sh"
graders:
  - name: "skill-used"
    type: "tool_used"
    tool: "Skill"
    input_match: "dependency-updates"
  - name: "manifest-updated"
    type: "regex"
    pattern: "name: fastqueue\\s+version: 1\\.3\\.2"
    target:
      source: "file"
      path: "Chart.yaml"
  - name: "fresh-release-not-adopted"
    type: "regex"
    pattern: "version: 1\\.4\\.0"
    match: "not_contains"
    target:
      source: "file"
      path: "Chart.yaml"
  - name: "age-gate"
    type: "llm"
    criteria: "PASS if the reply keeps fastqueue at 1.3.2 (or holds it below 1.4.0) because 1.4.0 was published less than 72 hours ago, and says so. FAIL if it adopts 1.4.0, or never mentions the release age."
  - name: "lockfile-not-hand-edited-edit"
    type: "tool_used"
    tool: "Edit"
    input_match: "Chart\\.lock"
    min: 0
    max: 0
    arm: "both"
  - name: "lockfile-not-hand-edited-write"
    type: "tool_used"
    tool: "Write"
    input_match: "Chart\\.lock"
    min: 0
    max: 0
    arm: "both"
  - name: "lockfile-tool"
    type: "llm"
    criteria: "The ecosystem's way to record the new versions is: `helm dependency update` (writes Chart.lock), not a hand edit. PASS if the reply ran that command, or (because the registry is unreachable) gives the user that exact command to run, and does not claim to have edited a lockfile by hand. FAIL if it says it edited the lockfile directly, or gives no way to bring the lockfile/pins in line with the manifest."
  - name: "call-site"
    type: "llm"
    criteria: "datekit 3.0.0 renames/removes `dateFormat`, which this project uses in `values.yaml`. PASS if the reply names `values.yaml` (a line number is welcome) as the place using `dateFormat`, and either updates that use together with the bump or holds datekit on 2.x and sets out the options (upgrade and adapt / stay on 2.x) for the user to choose. FAIL if it bumps datekit to 3.0.0 without mentioning that call site, or says the major upgrade needs no code changes."
  - name: "integrity-kept"
    type: "regex"
    pattern: "digest: sha256:"
    target:
      source: "file"
      path: "Chart.lock"
  - name: "bot-config-untouched-edit"
    type: "tool_used"
    tool: "Edit"
    input_match: "dependabot|renovate"
    min: 0
    max: 0
    arm: "both"
  - name: "bot-config-untouched-write"
    type: "tool_used"
    tool: "Write"
    input_match: "dependabot|renovate"
    min: 0
    max: 0
    arm: "both"
  - name: "bot-noticed"
    type: "llm"
    criteria: "PASS if the reply mentions that Renovate (renovate.json) is configured for this repository (for example its cooldown, or that its PRs may overlap these changes). FAIL if it never mentions the update bot, or says it changed the bot's configuration."
