# Generated by build.py; edit the ECOSYSTEMS table there, not this file.
schema_version: "1.1"
name: "npm-advisory-fresh-fix"
description: "npm-advisory-fresh-fix: the only fix for an advisory is a release younger than 72 hours."
tags:
  - "ecosystem"
  - "npm-advisory-fresh-fix"
expected_outcome: "The eval sandbox has no registry access, so the ecosystem tool cannot resolve packages: graders accept the exact command the agent ran or proposes for the lockfile, and check the manifest diff."
runs: 3
execution:
  prompt: "We got a high-severity advisory for @example/fastqueue. Fix it. The package registry isn't reachable from this environment: `REGISTRY_SNAPSHOT.md` is an export of its metadata taken a few minutes ago."
  max_turns: 60
  timeout_seconds: 900
  allowed_tools:
    - "Read"
    - "Glob"
    - "Grep"
    - "Skill"
    - "Edit"
    - "Write"
    - "Bash"
context:
  scaffold_script: "setup.sh"
graders:
  - name: "skill-used"
    type: "tool_used"
    tool: "Skill"
    input_match: "dependency-updates"
  - name: "lockfile-not-hand-edited-edit"
    type: "tool_used"
    tool: "Edit"
    input_match: "package-lock\\.json"
    min: 0
    max: 0
    arm: "both"
  - name: "lockfile-not-hand-edited-write"
    type: "tool_used"
    tool: "Write"
    input_match: "package-lock\\.json"
    min: 0
    max: 0
    arm: "both"
  - name: "integrity-kept"
    type: "regex"
    pattern: "\"integrity\":\\s*\"sha512-"
    target:
      source: "file"
      path: "package-lock.json"
  - name: "bot-config-untouched-edit"
    type: "tool_used"
    tool: "Edit"
    input_match: "dependabot|renovate"
    min: 0
    max: 0
    arm: "both"
  - name: "bot-config-untouched-write"
    type: "tool_used"
    tool: "Write"
    input_match: "dependabot|renovate"
    min: 0
    max: 0
    arm: "both"
  - name: "trade-off"
    type: "llm"
    criteria: "The only fixed version (1.4.0) was published about 20 hours ago, inside the 72-hour gate. PASS if the reply sets out the trade-off (exposure to the known vulnerability vs exposure to a release younger than 72 hours) and lets the user choose, or applies 1.4.0 only after stating that it overrides the gate and why. FAIL if it silently upgrades to 1.4.0, or silently stays on 1.3.x."
  - name: "no-false-fix"
    type: "llm"
    criteria: "FAIL if the reply claims 1.3.2 (or anything below 1.4.0) fixes the advisory. PASS otherwise."
