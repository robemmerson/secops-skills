version: 2
updates:
  # GitHub Actions: Dependabot keeps SHA pins and updates the `# vX.Y.Z` comment.
  # cooldown mirrors the dependency-updates skill's 72-hour minimum age rule.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

